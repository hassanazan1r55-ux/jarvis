:root{color-scheme:dark;--bg:#05080f;--ink:#e9f1f8;--dim:#8d9db2;--line:rgba(255,255,255,.12);--a1:#38e8ff;--a2:#6a7bff}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:400 16px/1.7 Inter,system-ui,sans-serif;background-image:radial-gradient(700px 500px at 50% 40%,rgba(56,232,255,.12),transparent 70%)}main{width:min(100%,650px);text-align:center;padding:clamp(28px,7vw,64px);border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.025)}.mark{display:inline-block;width:16px;height:16px;border:2px solid var(--a1);border-radius:50%;box-shadow:0 0 22px rgba(56,232,255,.4);margin-bottom:22px}h1{margin:0;font:800 clamp(84px,20vw,150px)/1 Sora,Inter,sans-serif;letter-spacing:-.09em;background:linear-gradient(100deg,var(--a1),var(--a2));background-clip:text;-webkit-background-clip:text;color:transparent}h2{font:600 clamp(20px,4vw,28px)/1.3 Sora,Inter,sans-serif;margin:22px 0 8px}p{color:var(--dim);margin:0 auto 28px;max-width:390px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}a{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:999px;text-decoration:none;font-weight:600;border:1px solid var(--line);color:var(--ink)}a.primary{background:linear-gradient(100deg,var(--a1),var(--a2));color:#04121a;border-color:transparent}a:focus-visible{outline:3px solid var(--a1);outline-offset:4px}@media(prefers-reduced-motion:no-preference){main{animation:appear .5s ease-out both}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}}
</style>
