<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 · Page not found</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;text-align:center;background:#02060d;color:#d8f6ff;font-family:'Segoe UI',system-ui,sans-serif;padding:20px;background-image:radial-gradient(700px 500px at 50% 40%,rgba(56,232,255,.15),transparent 65%)}
h1{font-size:clamp(80px,20vw,180px);letter-spacing:.08em;color:#d8f9ff;text-shadow:0 0 30px #38e8ff,0 0 80px rgba(56,232,255,.5)}
p{margin:10px 0 28px;color:#6f9bad;letter-spacing:.2em;text-transform:uppercase;font-size:14px}
a{display:inline-block;padding:14px 28px;border:1px solid #38e8ff;color:#38e8ff;text-decoration:none;letter-spacing:.2em;text-transform:uppercase;font-size:13px;font-weight:700;transition:.25s}
a:hover{background:#38e8ff;color:#00131a;box-shadow:0 0 26px rgba(56,232,255,.6)}
</style>
</head>
<body>
<div>
  <h1>404</h1>
  <p>Signal lost &middot; page not found</p>
  <a href="/">Back to home</a>
</div>
</body>
</html>
